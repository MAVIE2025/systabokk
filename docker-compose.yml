# Production sur le Cloud Server Systalink (Dakar) : appli + PostgreSQL + HTTPS, sur un seul serveur.
#   ./deploy.sh                                       → construit, migre, démarre
#   docker compose run --rm migrate npm run db:seed   → données de démo + Pass Jury (une fois)

services:
  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_BASE_URL: http://127.0.0.1:3000
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: systabokk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: systabokk
    # Accessible seulement depuis le serveur lui-même (jamais depuis Internet)
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systabokk -d systabokk"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  migrate:
    build: { context: ., target: builder }
    env_file: .env
    command: npm run db:migrate
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
